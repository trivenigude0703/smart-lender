<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartLender - Evaluation Form (Backup)</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    :root{
      --bg1:#0f172a;
      --bg2:#1e293b;
      --primary:#3b82f6;
      --secondary:#06b6d4;
      --text:#ffffff;
      --text-secondary:#cbd5e1;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
      background-size:300% 300%;
      animation:bgMove 10s ease infinite;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:30px 15px;
    }

    @keyframes bgMove{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    .container{
      width:100%;
      max-width:850px;
      background:rgba(255,255,255,.08);
      backdrop-filter:blur(15px);
      border:1px solid rgba(255,255,255,.15);
      border-radius:20px;
      padding:40px;
      box-shadow:0 20px 40px rgba(0,0,0,.35);
    }

    h1{
      color:#fff;
      text-align:center;
      margin-bottom:10px;
      font-size:2.3rem;
    }

    .subtitle{
      text-align:center;
      color:var(--secondary);
      margin-bottom:30px;
      font-size:1rem;
    }

    form{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:20px;
    }

    .form-group{
      display:flex;
      flex-direction:column;
    }

    .form-group-full{
      grid-column:1/3;
    }

    label{
      color:white;
      margin-bottom:8px;
      font-weight:500;
    }

    input,
    select{
      width:100%;
      padding:12px 15px;
      border:none;
      outline:none;
      border-radius:10px;
      background:rgba(255,255,255,.12);
      color:white;
      font-size:15px;
      border:1px solid rgba(255,255,255,.15);
      transition:.3s;
    }

    input::placeholder{
      color:#cbd5e1;
    }

    select option{
      color:black;
    }

    input:focus,
    select:focus{
      border-color:#06b6d4;
      box-shadow:0 0 12px rgba(6,182,212,.35);
    }

    .submit-container{
      grid-column:1/3;
      text-align:center;
      margin-top:10px;
    }

    .submit-container input{
      width:auto;
      cursor:pointer;
      background:linear-gradient(135deg,#06b6d4,#3b82f6);
      color:white;
      border:none;
      padding:14px 40px;
      border-radius:12px;
      font-size:16px;
      font-weight:600;
      transition:.3s;
      box-shadow:0 10px 25px rgba(59,130,246,.35);
    }

    .submit-container input:hover{
      transform:translateY(-3px);
      box-shadow:0 15px 30px rgba(59,130,246,.45);
    }

    .home-btn{
      display:inline-block;
      text-decoration:none;
      color:white;
      background:linear-gradient(135deg,#3b82f6,#2563eb);
      padding:10px 20px;
      border-radius:10px;
      font-weight:500;
      transition:.3s;
    }

    .home-btn:hover{
      transform:translateY(-3px);
      box-shadow:0 10px 20px rgba(59,130,246,.4);
    }

    @media(max-width:768px){

      .container{
        padding:25px;
      }

      h1{
        font-size:1.8rem;
      }

      form{
        grid-template-columns:1fr;
      }

      .form-group-full,
      .submit-container{
        grid-column:1;
      }

      .submit-container input{
        width:100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SmartLender Eligibility Form (Backup)</h1>

  <div class="subtitle">
    Enter applicant credit details below to predict eligibility status
  </div>

  <form action="/predict" method="POST">

    <input type="hidden" name="use_dup" value="true">

    <div class="form-group">
      <label for="gender">Gender</label>
      <select name="gender" id="gender">
        <option value="1">Male</option>
        <option value="0">Female</option>
      </select>
    </div>

    <div class="form-group">
      <label for="married">Married</label>
      <select name="married" id="married">
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>
    </div>

    <div class="form-group">
      <label for="dependents">Dependents</label>
      <select name="dependents" id="dependents">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3+</option>
      </select>
    </div>

    <div class="form-group">
      <label for="education">Education</label>
      <select name="education" id="education">
        <option value="1">Graduate</option>
        <option value="0">Not Graduate</option>
      </select>
    </div>

    <div class="form-group">
      <label for="self_employed">Self Employed</label>
      <select name="self_employed" id="self_employed">
        <option value="0">No</option>
        <option value="1">Yes</option>
      </select>
    </div>

    <div class="form-group">
      <label for="credit_history">Credit History Status</label>
      <select name="credit_history" id="credit_history">
        <option value="1.0">Good (No Delinquencies / Active History)</option>
        <option value="0.0">Bad (Past Delinquencies / Missing History)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="property_area">Property Area</label>
      <select name="property_area" id="property_area">
        <option value="2">Urban</option>
        <option value="1">Semiurban</option>
        <option value="0">Rural</option>
      </select>
    </div>

    <div class="form-group">
      <label for="loan_amount_term">Loan Amount Term (Months)</label>
      <input
        type="number"
        name="loan_amount_term"
        id="loan_amount_term"
        value="360"
        min="12"
        max="480"
        required>
    </div>

    <div class="form-group">
      <label for="applicant_income">Applicant Monthly Income ($)</label>
      <input
        type="number"
        name="applicant_income"
        id="applicant_income"
        placeholder="e.g. 5000"
        min="0"
        required>
    </div>

    <div class="form-group">
      <label for="coapplicant_income">Coapplicant Monthly Income ($)</label>
      <input
        type="number"
        name="coapplicant_income"
        id="coapplicant_income"
        placeholder="e.g. 1500"
        min="0"
        required>
    </div>

    <div class="form-group form-group-full">
      <label for="loan_amount">Requested Loan Amount ($ Thousands)</label>
      <input
        type="number"
        name="loan_amount"
        id="loan_amount"
        placeholder="e.g. 120 (for $120,000)"
        min="1"
        required>
    </div>

    <div class="submit-container">
      <input type="submit" value="Evaluate Eligibility (Backup)">
    </div>

  </form>

  <div style="text-align:center;margin-top:25px;">
    <a href="/" class="home-btn">Back to Home</a>
  </div>

</div>

</body>
</html>
